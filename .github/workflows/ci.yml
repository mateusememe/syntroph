name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          fmt_files="$(gofmt -l .)"
          if [ -n "$fmt_files" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_files"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race
