# Syntroph runtime Skill Catalog lock (.syntroph/skills.runtime.lock.yaml).
#
# This is SkillPort's own repository-scoped runtime lock (ADR 0027), read by
# `syntroph skill sync` from local disk only. It is distinct from the
# skills-lock.json at the repository root, which is an unrelated,
# pre-existing lock consumed by an npx-based development-tool skill
# installer that vendors .agents/skills/* into this repository in the first
# place.
#
# Every package below is declared under source_id "mattpocock", resolved
# against the "mattpocock" filesystem source configured in
# .syntroph/config.yaml (skills.sources), which points at the .agents/skills
# directory already committed to this repository. Sync performs no network
# access, credential lookup, or installer invocation: it only reads the
# files declared here from local disk and validates them.
#
# diagnosing-bugs is declared like every other package, with no
# special-casing: its scripts/hitl-loop.template.sh file has a ".sh"
# extension outside the Skill Package static-asset allow-list, so
# `syntroph skill sync` classifies the whole package as an
# UnsupportedSkillPackage automatically. The rest of the catalog is
# unaffected.
schema_version: 1
packages:
  - schema_version: 1
    source_id: mattpocock
    name: code-review
    directory: code-review
    description: >-
      Review the diff since a fixed point (a commit, branch, tag, or
      merge-base) along two axes: adherence to the repository's documented
      coding standards, and fidelity to the originating issue or spec.
      Both axes run as parallel sub-agents and report side by side.
    license: MIT
    source_url: https://github.com/mattpocock/skills
    source_revision: main
    instructions: SKILL.md
    files:
      - SKILL.md
      - agents/openai.yaml
    arguments_schema:
      type: object
      properties:
        fixed_point:
          type: string
      required:
        - fixed_point

  - schema_version: 1
    source_id: mattpocock
    name: codebase-design
    directory: codebase-design
    description: >-
      Shared vocabulary for designing deep modules. Use it to design or
      improve a module's interface, find deepening opportunities, decide
      where a seam belongs, or make code more testable and AI-navigable.
    license: MIT
    source_url: https://github.com/mattpocock/skills
    source_revision: main
    instructions: SKILL.md
    files:
      - SKILL.md
      - agents/openai.yaml
      - DEEPENING.md
      - DESIGN-IT-TWICE.md

  - schema_version: 1
    source_id: mattpocock
    name: diagnosing-bugs
    directory: diagnosing-bugs
    description: >-
      Diagnosis loop for something broken, throwing, failing, or slow: read
      CONTEXT.md and the relevant ADRs, then work the hypothesis loop while
      redacting secrets from any captured command output. Ships alongside
      a hitl-loop.template.sh helper script, which the Skill Package
      static-asset allow-list rejects, so this package syncs as an
      UnsupportedSkillPackage.
    license: MIT
    source_url: https://github.com/mattpocock/skills
    source_revision: main
    instructions: SKILL.md
    files:
      - SKILL.md
      - agents/openai.yaml
      - scripts/hitl-loop.template.sh

  - schema_version: 1
    source_id: mattpocock
    name: domain-modeling
    directory: domain-modeling
    description: >-
      Build and sharpen the project's domain model. Use it when discussing
      codebase terminology, writing or editing CONTEXT.md, or recording an
      ADR.
    license: MIT
    source_url: https://github.com/mattpocock/skills
    source_revision: main
